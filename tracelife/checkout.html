<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout | TraceLife</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body>
    <div class="top-bar">Secure Checkout</div>
    <header class="header">
      <div class="logo"><a href="index.html">TraceLife</a></div>
    </header>

    <section class="section">
      <h1>Checkout</h1>
      <form class="grid" style="max-width: 400px; margin: auto">
        <input type="text" placeholder="Full Name" required />
        <input type="email" placeholder="Email" required />
        <input type="text" placeholder="Address" required />
        <input type="text" placeholder="City" required />
        <input type="text" placeholder="Postal Code" required />
        <input type="text" placeholder="Promo code" />
        <button class="btn" type="submit">Pay Now</button>
      </form>
    </section>

    <footer class="footer">© 2024 TraceLife Beverages</footer>

    <script src="assets/app.js"></script>
  </body>
</html>
