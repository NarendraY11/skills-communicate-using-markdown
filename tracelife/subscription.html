<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subscription | TraceLife</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body>
    <div class="top-bar">Pause or cancel anytime</div>
    <header class="header">
      <div class="logo"><a href="index.html">TraceLife</a></div>
      <nav>
        <a href="shop.html">Shop</a>
        <a href="subscription.html">Subscription</a>
        <a href="about.html">About</a>
        <a href="faq.html">FAQ</a>
        <a href="#" data-cart-open>Cart</a>
      </nav>
    </header>

    <section class="section">
      <h1>Build Your Subscription</h1>
      <form class="grid grid-2">
        <label
          >Variant
          <select>
            <option>Focus</option>
            <option>Glow</option>
            <option>Immune</option>
            <option>Calm</option>
            <option>Hydrate</option>
          </select>
        </label>
        <label
          >Quantity
          <input type="number" value="6" min="1" />
        </label>
        <label
          >Frequency
          <select>
            <option>Every 2 Weeks</option>
            <option>Monthly</option>
          </select>
        </label>
        <button class="btn" type="submit">Subscribe</button>
      </form>
    </section>

    <footer class="footer">© 2024 TraceLife Beverages</footer>

    <div id="cartDrawer" class="cart-drawer">
      <button class="btn" data-cart-close>Close</button>
    </div>

    <script src="assets/app.js"></script>
  </body>
</html>
